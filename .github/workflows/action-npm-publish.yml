# https://docs.npmjs.com/trusted-publishers#step-2-configure-your-cicd-workflow

name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/maib-checkout-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        run: |
          GIT_TAG="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "$GIT_TAG" ]; then
            echo "Tag $GIT_TAG does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run build --if-present
      # - run: npm test
      - run: npm publish
